name: Publication safeguards

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python3 tools/check_publication.py --history --allow-identity-metadata
      - run: python3 -m unittest discover -s tests -p test_publication_tools.py -v
      - run: python3 -m pip install -r requirements-lan.txt
      - run: PYTHONPATH=.:tests python3 -m unittest test_lan_setup_bootstrap test_lan_host_setup test_lan_https test_lan_https_server -q
